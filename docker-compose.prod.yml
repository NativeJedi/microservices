services:
  reservations:
    image: microservices-reservations:prod
    build:
      context: .
      dockerfile: ./apps/reservations/Dockerfile
      target: production
    env_file:
      - ./apps/reservations/.env
    ports:
      - '3000:3000'
    depends_on:
      - mongo
    restart: unless-stopped

  auth:
    image: microservices-auth:prod
    build:
      context: .
      dockerfile: ./apps/auth/Dockerfile
      target: production
    env_file:
      - ./apps/auth/.env
    ports:
      - '3001:3001'
    depends_on:
      - mongo
    restart: unless-stopped

  payments:
    image: microservices-payments:prod
    build:
      context: .
      dockerfile: ./apps/auth/Dockerfile
      target: production
    env_file:
      - ./apps/payments/.env
    depends_on:
      - mongo
    restart: unless-stopped

  notifications:
    image: microservices-notifications:prod
    build:
      context: .
      dockerfile: ./apps/notifications/Dockerfile
      target: production
    env_file:
      - ./apps/notifications/.env
    depends_on:
      - mongo
    restart: unless-stopped

  mongo:
    image: mongo:7
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

volumes:
  mongo-data:
